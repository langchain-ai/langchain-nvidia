[tool.poetry]
name = "langchain-nvidia-switchyard"
version = "0.1.0"
description = "LangChain middleware for Switchyard libsy routing"
authors = []
readme = "README.md"
repository = "https://github.com/langchain-ai/langchain-nvidia"
license = "MIT"
packages = [
  { include = "langchain_nvidia_switchyard" },
]

[tool.poetry.urls]
"Source Code" = "https://github.com/langchain-ai/langchain-nvidia/tree/main/libs/switchyard"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
nemo-switchyard = ">=0.2.0"
langchain = ">=1.3.14,<2"
deepagents = { version = ">=0.7.4,<0.8", optional = true }
langchain-openrouter = { version = ">=0.2.7,<0.3", optional = true }
python-dotenv = { version = ">=1,<2", optional = true }

[tool.poetry.extras]
deepagents = ["deepagents"]
openrouter = ["deepagents", "langchain-openrouter", "python-dotenv"]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=9,<10"
pytest-asyncio = ">=1.3,<2"
nemo-switchyard = { git = "https://github.com/NVIDIA-NeMo/Switchyard.git", branch = "main" }
deepagents = ">=0.7.4,<0.8"
langchain-openrouter = ">=0.2.7,<0.3"
python-dotenv = ">=1,<2"

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.14,<1"

[tool.poetry.group.typing]
optional = true

[tool.poetry.group.typing.dependencies]
mypy = ">=1.19,<2"

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.codespell.dependencies]
codespell = ">=2.2,<3"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = '--strict-markers --strict-config --durations=5 -m "not e2e"'
markers = [
  "e2e: makes paid calls to real OpenRouter models",
  "compile: marks compile-only integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"example.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# The source-built libsy extension does not currently publish a py.typed marker.
module = ["switchyard", "switchyard.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
