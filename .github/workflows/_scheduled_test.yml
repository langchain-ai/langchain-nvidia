name: Scheduled tests
run-name: langchain-nvidia Scheduled tests

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 8 * * *'

permissions:
  contents: read

env:
  POETRY_VERSION: "2.3.3"

jobs:
  build:
    name: Python ${{ matrix.python-version }} - ${{ matrix.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            working-directory: "libs/trt"
          - python-version: "3.11"
            working-directory: "libs/trt"
          - python-version: "3.11"
            working-directory: "libs/ai-endpoints"
          - python-version: "3.13"
            working-directory: "libs/ai-endpoints"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "./.github/actions/poetry_setup"
        with:
          python-version: ${{ matrix.python-version }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: ${{ matrix.working-directory }}
          cache-key: scheduled

      - name: Install dependencies
        run: poetry install --with test,test_integration
        working-directory: ${{ matrix.working-directory }}

      - name: Run unit tests
        run: make tests
        working-directory: ${{ matrix.working-directory }}

      - name: Run integration smoke tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ "${{ matrix.working-directory }}" = "libs/ai-endpoints" ]; then
            make integration_tests PYTEST_ARGS='-m "not accuracy" --reruns 2 --reruns-delay 5 --only-rerun "ReadTimeout|SocketTimeoutError|ConnectionResetError|ChunkedEncodingError|Bad Gateway|502|503|504"'
          else
            make integration_tests PYTEST_ARGS='-m "not accuracy"'
          fi
        working-directory: ${{ matrix.working-directory }}

      - name: Run model accuracy tests
        if: matrix.working-directory == 'libs/ai-endpoints'
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: make integration_tests PYTEST_ARGS="-m accuracy"
        working-directory: ${{ matrix.working-directory }}

      - name: Ensure the tests did not create any additional files
        working-directory: ${{ matrix.working-directory }}
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'
